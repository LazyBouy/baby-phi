# Committed, non-secret defaults. Overlaid by config/<profile>.toml and
# PHI_* environment variables. Secrets MUST NOT live here.

[server]
host = "0.0.0.0"
port = 8080
# tls = { cert_path = "...", key_path = "..." }   # optional; usually set per-env

[storage]
data_dir = "data/phi.db"
namespace = "phi"
database = "v0"

[telemetry]
log_filter = "info"
json_logs = true

# Session-cookie signing.
#
# `secret` is a publicly-known dev placeholder; every real deployment MUST
# override it via `PHI_SESSION__SECRET` (env var). Setting a weak or
# default secret in production means anyone can forge admin sessions.
#
# `secure = true` is correct for every environment that fronts TLS.
# `config/dev.toml` flips it to `false` so the cookie survives plaintext
# localhost HTTP.
[session]
secret = "dev-only-placeholder-override-via-env-var-32b"
cookie_name = "phi_kernel_session"
ttl_seconds = 43200
secure = true
# Platform-wide concurrency ceiling on active agent-loop sessions
# (M5 / ADR-0031). Launches beyond this cap return HTTP 503
# `SESSION_WORKER_SATURATED`. Distinct from the per-agent
# `parallelize` cap (409 `PARALLELIZE_CAP_REACHED`, which comes from
# the agent's blueprint).
max_concurrent = 16

# Per-listener tuning (CH-22 / ADR-0035).
[listeners.catalog]
# Audit emission mode for the agent-catalog listener.
#   silent (default): no audit event per fire — production lean.
#   debug: emit `agent_catalog_refreshed` (Silent class) on every fire
#          for end-to-end traceability during dev / acceptance tests.
# Override via env: PHI_LISTENERS__CATALOG__AUDIT_MODE=debug.
audit_mode = "silent"

# Consent state-machine sweeper (CH-10 / ADR-0047 §D47.7).
# Periodically scans for past-deadline `Requested` consents and flips
# them to `TimedOut`. Single-pod-only at v0 — multi-pod leader election
# is deferred to M7b. Set `sweeper_interval_secs = 0` to disable the
# sweeper (used by acceptance tests that drive the sweep manually).
# Override via env: PHI_CONSENT__SWEEPER_INTERVAL_SECS=120.
[consent]
sweeper_interval_secs = 60
